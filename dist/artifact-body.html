<title>KET Vocabulary Rescue</title>
<style>
/* assets/css/app.css */
/* ===========================================================================
   app.css — one stylesheet, no framework, light + dark.
   Students open this on phones, so every layout is single-column first.
   =========================================================================== */

/* ---- tokens -------------------------------------------------------------- */
:root {
  color-scheme: light;

  --ink:        #10151c;
  --ink-soft:   #4d5a68;
  --ink-faint:  #7d8b99;
  --ground:     #f4f6f8;
  --surface:    #ffffff;
  --surface-2:  #eef1f5;
  --line:       #dde3ea;

  --brand:      #0e7c86;
  --brand-ink:  #ffffff;
  --brand-soft: #e2f2f3;

  --red:        #c0392b;
  --red-soft:   #fbe9e7;
  --amber:      #b7791f;
  --amber-soft: #fdf3e0;
  --green:      #1e7a4d;
  --green-soft: #e4f4ec;

  --radius:     14px;
  --radius-sm:  9px;
  --shadow:     0 1px 2px rgba(16, 21, 28, .06), 0 8px 24px rgba(16, 21, 28, .06);
  --font:       ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ink:        #e8edf3;
    --ink-soft:   #a4b1c0;
    --ink-faint:  #74838f;
    --ground:     #0d1117;
    --surface:    #161b22;
    --surface-2:  #1d242d;
    --line:       #2a323c;

    --brand:      #35b3bd;
    --brand-ink:  #06232a;
    --brand-soft: #133238;

    --red:        #f2857a;
    --red-soft:   #38201f;
    --amber:      #e0b25a;
    --amber-soft: #362c17;
    --green:      #62c99a;
    --green-soft: #16302a;

    --shadow:     0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --ink: #e8edf3; --ink-soft: #a4b1c0; --ink-faint: #74838f;
  --ground: #0d1117; --surface: #161b22; --surface-2: #1d242d; --line: #2a323c;
  --brand: #35b3bd; --brand-ink: #06232a; --brand-soft: #133238;
  --red: #f2857a; --red-soft: #38201f;
  --amber: #e0b25a; --amber-soft: #362c17;
  --green: #62c99a; --green-soft: #16302a;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
}

/* ---- base ---------------------------------------------------------------- */
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.55;
  color: var(--ink);
  background: var(--ground);
  -webkit-text-size-adjust: 100%;
}

h1, h2, h3, h4 { margin: 0; line-height: 1.25; font-weight: 650; letter-spacing: -.01em; }
p { margin: 0 0 .6rem; }
p:last-child { margin-bottom: 0; }

.muted { color: var(--ink-soft); font-size: .9rem; }
.warn {
  background: var(--amber-soft); color: var(--amber);
  padding: .6rem .8rem; border-radius: var(--radius-sm); font-size: .9rem;
}

.page { max-width: 940px; margin: 0 auto; padding: 0 1rem 4rem; }

/* ---- header -------------------------------------------------------------- */
.top {
  display: flex; align-items: center; justify-content: space-between;
  gap: 1rem; flex-wrap: wrap;
  padding: 1.25rem 0 1rem;
  border-bottom: 1px solid var(--line);
  margin-bottom: 1.25rem;
}
.top__brand { display: flex; align-items: center; gap: .75rem; }
.top__mark {
  display: grid; place-items: center;
  width: 40px; height: 40px; flex: none;
  border-radius: 11px;
  background: var(--brand); color: var(--brand-ink);
  font-weight: 800; font-size: .85rem; letter-spacing: .04em;
}
.top__title { font-size: 1.15rem; }
.top__tag { margin: 0; font-size: .82rem; color: var(--ink-faint); }
.top__user { display: flex; align-items: center; gap: .6rem; }
.top__name { font-weight: 600; font-size: .92rem; }

.crumb { margin-bottom: .75rem; }

/* ---- panels -------------------------------------------------------------- */
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1.1rem;
  margin-bottom: 1rem;
  box-shadow: var(--shadow);
}
.panel--hero { border-color: var(--brand); }
.panel__head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: .75rem; flex-wrap: wrap; margin-bottom: .75rem;
}
.panel__head h3 { font-size: 1rem; letter-spacing: .01em; }

.why {
  font-size: .9rem; color: var(--ink-soft);
  border-left: 3px solid var(--brand); padding-left: .7rem; margin-bottom: .8rem;
}
.rule { margin-top: .7rem; font-size: .84rem; }

.foot { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--line); }

/* ---- buttons ------------------------------------------------------------- */
.btn {
  font: inherit; font-size: .92rem; font-weight: 600;
  padding: .55rem 1rem;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--surface-2); color: var(--ink);
  cursor: pointer;
  transition: background .12s ease, border-color .12s ease, transform .06s ease;
}
.btn:hover  { border-color: var(--brand); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: default; }
.btn--primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn--ghost   { background: transparent; }
.btn--icon    { padding: .3rem .5rem; font-size: 1rem; line-height: 1; }
.btn--red     { background: var(--red-soft);   border-color: var(--red);   color: var(--red); }
.btn--amber   { background: var(--amber-soft); border-color: var(--amber); color: var(--amber); }
.btn--speak   { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }

.row { display: flex; align-items: center; gap: .5rem; }
.row--end     { justify-content: flex-end; margin-top: .9rem; }
.row--between { justify-content: space-between; }
.row--wrap    { flex-wrap: wrap; margin-top: .8rem; }

/* ---- gate ---------------------------------------------------------------- */
.gate { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
.gate__card {
  width: min(460px, 100%);
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 1.75rem; box-shadow: var(--shadow);
}
.gate__card h2 { font-size: 1.35rem; margin-bottom: .4rem; }
.gate__list { margin: 1.1rem 0; }
.gate__foot { margin-top: 1.1rem; font-size: .8rem; }

/* ---- tiles / grid -------------------------------------------------------- */
.grid { display: grid; gap: .7rem; grid-template-columns: 1fr; }
@media (min-width: 620px) { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 860px) { .grid--acts { grid-template-columns: repeat(3, 1fr); } }

.tile {
  display: flex; flex-direction: column; gap: .35rem;
  text-align: left; font: inherit;
  padding: .85rem .9rem;
  background: var(--surface-2);
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  color: var(--ink); cursor: pointer;
  transition: border-color .12s ease, transform .06s ease;
}
.tile:hover  { border-color: var(--brand); }
.tile:active { transform: translateY(1px); }
.tile__n {
  font-size: .72rem; font-weight: 800; letter-spacing: .08em;
  color: var(--brand);
}
.tile__title { font-weight: 650; font-size: .95rem; }
.tile__meta  { font-size: .8rem; color: var(--ink-faint); }
.tile__phase {
  font-size: .66rem; font-weight: 800; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-faint);
}
.tile--understand .tile__phase { color: var(--brand); }
.tile--retrieve   .tile__phase { color: var(--amber); }
.tile--transfer   .tile__phase { color: var(--green); }

/* ---- status bar / chips -------------------------------------------------- */
.bar {
  display: flex; height: 7px; border-radius: 99px; overflow: hidden;
  background: var(--surface-2); border: 1px solid var(--line); margin: .5rem 0;
}
.bar__seg { display: block; height: 100%; }
.bar__seg--red   { background: var(--red); }
.bar__seg--amber { background: var(--amber); }
.bar__seg--green { background: var(--green); }

.tallyrow { display: flex; align-items: center; gap: .45rem; flex-wrap: wrap; }
.chip {
  display: inline-block; padding: .12rem .5rem;
  border-radius: 99px; font-size: .76rem; font-weight: 700;
  text-transform: capitalize;
}
.chip--red   { background: var(--red-soft);   color: var(--red); }
.chip--amber { background: var(--amber-soft); color: var(--amber); }
.chip--green { background: var(--green-soft); color: var(--green); }
.chip:empty  { width: 10px; height: 10px; padding: 0; border-radius: 99px; }

.streak { font-size: .85rem; font-weight: 650; color: var(--amber); }

/* ---- activity frame ------------------------------------------------------ */
.act {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
}
.act__bar { display: flex; align-items: center; gap: .7rem; padding: .9rem 1rem .7rem; }
.act__head { min-width: 0; }
.act__title { font-size: 1rem; }
.act__meta { font-size: .8rem; color: var(--ink-faint); }
.act__body { padding: 1rem; }
.act__tools { padding: .9rem 0 .3rem; }

.progress { height: 3px; background: var(--surface-2); }
.progress > i { display: block; height: 100%; width: 0; background: var(--brand); transition: width .25s ease; }

.qcard { }
.qcard__prompt { font-size: 1.15rem; font-weight: 600; margin-bottom: .9rem; }
.sectiontag {
  display: inline-block; margin-bottom: .5rem;
  font-size: .68rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
  color: var(--brand);
}

/* ---- options ------------------------------------------------------------- */
.options { display: flex; flex-wrap: wrap; gap: .5rem; }
.options--stack { flex-direction: column; }
.options--grid  { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }

.option {
  font: inherit; font-size: .95rem; text-align: left;
  padding: .65rem .85rem;
  background: var(--surface-2); color: var(--ink);
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  cursor: pointer;
}
.option:hover:not(:disabled) { border-color: var(--brand); }
.option--long { width: 100%; }
.option--right { background: var(--green-soft); border-color: var(--green); color: var(--green); font-weight: 650; }
.option--wrong { background: var(--red-soft);   border-color: var(--red);   color: var(--red); }
.option:disabled { cursor: default; }

/* ---- inputs -------------------------------------------------------------- */
.bigin, .writer {
  width: 100%; font: inherit; font-size: 1.05rem;
  padding: .65rem .8rem;
  color: var(--ink); background: var(--surface-2);
  border: 1px solid var(--line); border-radius: var(--radius-sm);
}
.bigin:focus, .writer:focus, .gapinput:focus, .gapselect:focus {
  outline: 2px solid var(--brand); outline-offset: 1px;
}
.writer { font-size: 1rem; line-height: 1.6; resize: vertical; margin: .6rem 0; }

.gapline { font-size: 1.08rem; line-height: 2.1; }
.gapinput {
  font: inherit; font-size: 1rem;
  width: 8.5rem; padding: .18rem .45rem; margin: 0 .15rem;
  color: var(--ink); background: var(--surface-2);
  border: 1px solid var(--line); border-bottom: 2px solid var(--brand);
  border-radius: 6px;
}
.gapinput--right   { background: var(--green-soft); border-color: var(--green); color: var(--green); }
.gapinput--wrong   { background: var(--red-soft);   border-color: var(--red);   color: var(--red); width: 12rem; }
.gapinput--partial { background: var(--amber-soft); border-color: var(--amber); color: var(--amber); width: 12rem; }

.gapselect {
  font: inherit; font-size: .95rem; padding: .15rem .3rem; margin: 0 .1rem;
  color: var(--ink); background: var(--surface-2);
  border: 1px solid var(--line); border-bottom: 2px solid var(--brand); border-radius: 6px;
}
.gapselect--right { background: var(--green-soft); border-color: var(--green); color: var(--green); }
.gapselect--wrong { background: var(--red-soft);   border-color: var(--red);   color: var(--red); }

.toggle { display: inline-flex; align-items: center; gap: .45rem; font-size: .88rem; color: var(--ink-soft); cursor: pointer; }
.toggle input { width: 16px; height: 16px; accent-color: var(--brand); }

/* ---- feedback ------------------------------------------------------------ */
.feedback {
  margin-top: .9rem; padding: .6rem .8rem;
  border-radius: var(--radius-sm); font-size: .92rem;
}
.feedback.is-correct { background: var(--green-soft); color: var(--green); }
.feedback.is-partial { background: var(--amber-soft); color: var(--amber); }
.feedback.is-wrong   { background: var(--red-soft);   color: var(--red); }

.reveal { margin-top: .7rem; font-size: 1rem; }
.why { font-size: .88rem; margin-top: .55rem; padding: .5rem .7rem; border-radius: var(--radius-sm); }
.why--ok { background: var(--green-soft); color: var(--green); }
.why--no { background: var(--red-soft);   color: var(--red); }
.traps { margin: .2rem 0 0; padding-left: 1.1rem; }
.traps__label { margin-top: .6rem; margin-bottom: .2rem; }
.scoreline { font-size: 1.05rem; margin-bottom: .6rem; }

/* ---- flashcards ---------------------------------------------------------- */
.qcard--flash { text-align: center; }
.flash__front { display: flex; align-items: center; justify-content: center; gap: .5rem; padding: 1.2rem 0 .4rem; }
.flash__word { font-size: 2rem; letter-spacing: -.02em; }
.flash__status { display: flex; align-items: center; justify-content: center; gap: .5rem; margin-bottom: 1rem; }
.flash__back { text-align: left; border-top: 1px solid var(--line); padding-top: .9rem; }
.flash__row { display: grid; grid-template-columns: 130px 1fr; gap: .5rem; padding: .35rem 0; }
.flash__label { font-size: .68rem; font-weight: 800; letter-spacing: .08em; color: var(--ink-faint); }
.flash__chunk { font-style: italic; }
@media (max-width: 520px) { .flash__row { grid-template-columns: 1fr; gap: 0; } }

/* ---- word bank ----------------------------------------------------------- */
.bank { margin: .9rem 0; padding: .7rem .8rem; background: var(--surface-2); border-radius: var(--radius-sm); }
.bank__label { font-size: .66rem; font-weight: 800; letter-spacing: .1em; color: var(--ink-faint); }
.bank__chips { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .4rem; }
.bank__chips--tight { margin: .2rem 0 .4rem; }
.bank__chip {
  font-size: .85rem; padding: .16rem .55rem;
  background: var(--surface); border: 1px solid var(--line); border-radius: 99px;
}
.bank__chip--btn { font: inherit; font-size: .85rem; color: var(--ink); cursor: pointer; }
.bank__chip--btn:hover { border-color: var(--brand); }
.bank__chip--red   { background: var(--red-soft);   border-color: var(--red);   color: var(--red); }
.bank__chip--amber { background: var(--amber-soft); border-color: var(--amber); color: var(--amber); }
.bank__chip--green { background: var(--green-soft); border-color: var(--green); color: var(--green); }

.bankwrap { display: grid; gap: 1rem; }
.bankcat h4 { font-size: .85rem; color: var(--brand); margin-bottom: .3rem; }

/* ---- tables -------------------------------------------------------------- */
.tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.wordtable, .buildtable { width: 100%; border-collapse: collapse; font-size: .9rem; min-width: 520px; }
.wordtable th, .buildtable th {
  text-align: left; font-size: .66rem; font-weight: 800; letter-spacing: .08em;
  color: var(--ink-faint); padding: .4rem .5rem; border-bottom: 1px solid var(--line);
}
.wordtable td, .buildtable td { padding: .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
.wordtable tr:last-child td, .buildtable tr:last-child td { border-bottom: 0; }
.chunk { font-style: italic; color: var(--ink-soft); }
.buildtable { min-width: 0; }

/* ---- exam labs ----------------------------------------------------------- */
.pillrow { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .8rem; }
.pill {
  font: inherit; font-size: .85rem; padding: .3rem .8rem;
  background: var(--surface-2); color: var(--ink);
  border: 1px solid var(--line); border-radius: 99px; cursor: pointer;
}
.pill--on  { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.pill--big { font-size: .95rem; padding: .45rem 1.1rem; }

.checkrow { display: grid; gap: .5rem; margin-bottom: .9rem; }
@media (min-width: 620px) { .checkrow { grid-template-columns: repeat(3, 1fr); } }
.checkrow__item {
  display: flex; flex-direction: column;
  padding: .5rem .7rem; background: var(--surface-2); border-radius: var(--radius-sm);
  font-size: .82rem;
}

.passage { font-size: 1.05rem; line-height: 2.2; }

.notice {
  background: var(--surface-2); border-left: 3px solid var(--brand);
  padding: .7rem .9rem; border-radius: var(--radius-sm); margin-bottom: .9rem;
}
.notice__label { font-size: .68rem; font-weight: 800; letter-spacing: .08em; color: var(--brand); }
.notice__text { margin: .3rem 0 0; }

/* ---- senses (LEAVE) ------------------------------------------------------ */
.senses { display: grid; gap: .3rem; }
@media (min-width: 620px) { .senses { grid-template-columns: repeat(2, 1fr); } }
.sense { display: flex; gap: .5rem; align-items: baseline; font-size: .85rem; }
.sense__code {
  display: inline-grid; place-items: center; flex: none;
  width: 22px; height: 22px; border-radius: 6px;
  background: var(--brand-soft); color: var(--brand);
  font-weight: 800; font-size: .75rem;
}

.buildcue { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; margin-bottom: .8rem; }
.buildcue__part {
  padding: .25rem .6rem; background: var(--brand-soft); color: var(--brand);
  border-radius: var(--radius-sm); font-weight: 600;
}
.buildcue__op { color: var(--ink-faint); font-size: .85rem; }

/* ---- writing lab --------------------------------------------------------- */
.checklist { display: flex; flex-wrap: wrap; gap: .35rem; margin: .5rem 0; }
.tick {
  font-size: .85rem; padding: .18rem .6rem; border-radius: 99px;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-faint);
}
.tick--btn { font-family: inherit; cursor: pointer; }
.tick--on { background: var(--green-soft); border-color: var(--green); color: var(--green); font-weight: 650; }
.counter { font-size: .85rem; font-weight: 650; }
.counter--ok  { color: var(--green); }
.counter--off { color: var(--ink-faint); }
.writerverdict--ok   { color: var(--green); font-weight: 600; font-size: .9rem; }
.writerverdict--todo { color: var(--ink-soft); font-size: .9rem; }

/* ---- clock --------------------------------------------------------------- */
.clock {
  margin-top: .6rem; font-variant-numeric: tabular-nums;
  font-size: 1.1rem; font-weight: 700; color: var(--brand);
}
.clock--big { font-size: 2rem; text-align: center; margin: .8rem 0; }
.clock--urgent { color: var(--red); }

/* ---- summary ------------------------------------------------------------- */
.summary { text-align: center; padding: .5rem 0; }
.summary__score { display: flex; align-items: baseline; justify-content: center; gap: .3rem; margin-bottom: .5rem; }
.summary__num { font-size: 3rem; font-weight: 750; letter-spacing: -.03em; }
.summary__den { font-size: 1.1rem; color: var(--ink-faint); }
.summary__score--green .summary__num { color: var(--green); }
.summary__score--amber .summary__num { color: var(--amber); }
.summary__score--red   .summary__num { color: var(--red); }
.summary__note  { font-size: .88rem; color: var(--ink-soft); max-width: 48ch; margin: 0 auto .9rem; }
.summary__clean { font-size: .92rem; color: var(--green); font-weight: 600; }
.summary__review { text-align: left; background: var(--surface-2); padding: .8rem 1rem; border-radius: var(--radius-sm); }
.summary__review h4 { font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: .4rem; }
.wordlist { margin: 0; padding-left: 1.1rem; font-size: .92rem; }
.wordlist li { margin-bottom: .2rem; }

</style>

<script>
/* assets/js/util.js */
/* ===========================================================================
   util.js — DOM helpers and the answer checker.

   The answer checker is deliberately more informative than right/wrong.
   KET penalises spelling, and the workbook keeps saying "change the form when
   necessary", so the student needs to know WHICH kind of mistake they made:

     correct   exact match
     form      right word, wrong grammatical form  (mean / means / meant)
     spelling  one keystroke away                  (recieve / receipt)
     wrong     a different word

   Only "correct" advances the SRS. "form" and "spelling" get a targeted
   nudge and a second look instead of a silent fail.
   =========================================================================== */

(function () {
  'use strict';

  /* ---- tiny DOM helpers ------------------------------------------------- */

  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(key => {
        const value = attrs[key];
        if (value === null || value === undefined || value === false) return;
        if (key === 'class') node.className = value;
        else if (key === 'html') node.innerHTML = value;
        else if (key === 'text') node.textContent = value;
        else if (key.indexOf('on') === 0 && typeof value === 'function') {
          node.addEventListener(key.slice(2).toLowerCase(), value);
        } else if (key === 'dataset') {
          Object.keys(value).forEach(d => { node.dataset[d] = value[d]; });
        } else {
          node.setAttribute(key, value === true ? '' : value);
        }
      });
    }
    (Array.isArray(children) ? children : children ? [children] : [])
      .forEach(child => {
        if (child === null || child === undefined || child === false) return;
        node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
      });
    return node;
  }

  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
    return node;
  }

  function shuffle(list) {
    const out = list.slice();
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = out[i]; out[i] = out[j]; out[j] = tmp;
    }
    return out;
  }

  function escapeHTML(str) {
    return String(str).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  /* ---- answer checking --------------------------------------------------- */

  function normalise(str) {
    return String(str == null ? '' : str)
      .toLowerCase()
      .replace(/[‘’]/g, "'")   // curly apostrophes from the .docx
      .replace(/[“”]/g, '"')
      .replace(/\s+/g, ' ')
      .trim()
      .replace(/[.,!?;:]+$/g, '')
      .trim();
  }

  // Crude but sufficient stemmer for A2 vocabulary: we only need to know
  // whether two strings are plausibly the same lexical item.
  function stem(word) {
    let s = word;
    if (s.length > 4 && /ies$/.test(s)) s = s.slice(0, -3) + 'y';
    else if (s.length > 4 && /(ses|xes|zes|ches|shes)$/.test(s)) s = s.slice(0, -2);
    else if (s.length > 3 && /s$/.test(s) && !/(ss|us|is)$/.test(s)) s = s.slice(0, -1);

    if (s.length > 4 && /ing$/.test(s)) s = s.slice(0, -3);
    else if (s.length > 3 && /ed$/.test(s)) s = s.slice(0, -2);

    if (s.length > 3 && /([bdfglmnprt])\1$/.test(s)) s = s.slice(0, -1);  // stopp -> stop
    if (s.length > 3 && /e$/.test(s)) s = s.slice(0, -1);                 // serve -> serv
    return s;
  }

  /**
   * The regular inflections of a base form. Used to separate "you wrote the
   * right word in the wrong grammatical form" (serve / serves) from "you
   * wrote the right word and misspelled it" (cancelled / canceled) — two
   * mistakes that need completely different advice.
   */
  function inflectionsOf(base) {
    const out = new Set();
    const b = base;
    if (!b || b.length < 2) return out;

    const add = x => { if (x && x !== b) out.add(x); };

    if (/[^aeiou]y$/.test(b)) {
      const trunk = b.slice(0, -1);
      add(trunk + 'ies'); add(trunk + 'ied'); add(b + 'ing');
    } else if (/e$/.test(b)) {
      const trunk = b.slice(0, -1);
      add(b + 's'); add(b + 'd'); add(trunk + 'ing');
    } else {
      add(b + 's');
      if (/(s|x|z|ch|sh)$/.test(b)) add(b + 'es');
      add(b + 'ed'); add(b + 'ing');
      // one-syllable consonant doubling: stop -> stopped / stopping
      const last = b.slice(-1);
      if (/[bdfglmnprt]/.test(last) && /[aeiou]/.test(b.slice(-2, -1))) {
        add(b + last + 'ed'); add(b + last + 'ing');
      }
    }
    return out;
  }

  function isFormOf(a, b) {
    return inflectionsOf(a).has(b) || inflectionsOf(b).has(a);
  }

  function levenshtein(a, b) {
    if (a === b) return 0;
    if (!a.length) return b.length;
    if (!b.length) return a.length;
    let prev = new Array(b.length + 1);
    for (let j = 0; j <= b.length; j++) prev[j] = j;
    for (let i = 1; i <= a.length; i++) {
      const curr = [i];
      for (let j = 1; j <= b.length; j++) {
        curr[j] = Math.min(
          prev[j] + 1,
          curr[j - 1] + 1,
          prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
        );
      }
      prev = curr;
    }
    return prev[b.length];
  }

  /**
   * @param  {string} given     what the student typed
   * @param  {string|string[]} expected  accepted answer(s)
   * @return {{verdict:string, expected:string, hint:string}}
   */
  function check(given, expected) {
    const answers = (Array.isArray(expected) ? expected : [expected]).map(normalise);
    const g = normalise(given);
    const primary = Array.isArray(expected) ? expected[0] : expected;

    if (!g) return { verdict: 'wrong', expected: primary, hint: 'Write something — a guess is evidence too.' };

    for (const a of answers) {
      if (g === a) return { verdict: 'correct', expected: primary, hint: '' };
    }
    // A real inflection of the target is a GRAMMAR mistake, not a typo.
    for (const a of answers) {
      if (isFormOf(g, a)) {
        return {
          verdict: 'form',
          expected: primary,
          hint: 'Right word, wrong form. Does the grammar of the sentence fit?'
        };
      }
    }
    // Otherwise a near miss is a spelling slip — including variants like
    // canceled / cancelled, where the form is fine and only the letters differ.
    for (const a of answers) {
      if (levenshtein(g, a) <= (a.length > 6 ? 2 : 1)) {
        return {
          verdict: 'spelling',
          expected: primary,
          hint: 'Almost — check the spelling. KET marks spelling.'
        };
      }
    }
    for (const a of answers) {
      if (stem(g) === stem(a)) {
        return {
          verdict: 'form',
          expected: primary,
          hint: 'Right word, wrong form. Does the grammar of the sentence fit?'
        };
      }
    }
    return { verdict: 'wrong', expected: primary, hint: '' };
  }

  window.EA = window.EA || {};
  window.EA.util = { el, clear, shuffle, escapeHTML, normalise, stem, inflectionsOf, isFormOf, check, levenshtein };
})();

/* assets/js/store.js */
/* ===========================================================================
   store.js — profiles + per-student progress, persisted in localStorage.

   Design notes
   - No server, no login. A teacher can hand out a link (or a folder) and a
     student just picks their name. Several students can share one device.
   - Everything is namespaced under one root key so it is easy to export,
     wipe, or move to a backend later without touching the activity code.
   =========================================================================== */

(function () {
  'use strict';

  const ROOT = 'englishactivities.v1';

  function blankState() {
    return { profiles: [], activeId: null, data: {} };
  }

  function read() {
    try {
      const raw = localStorage.getItem(ROOT);
      if (!raw) return blankState();
      const parsed = JSON.parse(raw);
      // Defensive: a half-written or hand-edited blob should not brick the app.
      if (!parsed || typeof parsed !== 'object') return blankState();
      parsed.profiles = Array.isArray(parsed.profiles) ? parsed.profiles : [];
      parsed.data = parsed.data && typeof parsed.data === 'object' ? parsed.data : {};
      return parsed;
    } catch (e) {
      return blankState();
    }
  }

  function write(state) {
    try {
      localStorage.setItem(ROOT, JSON.stringify(state));
      return true;
    } catch (e) {
      // Private windows and "block site data" settings both land here.
      return false;
    }
  }

  let state = read();

  const Store = {
    /* ---- profiles ------------------------------------------------------- */
    profiles() {
      return state.profiles.slice();
    },

    activeProfile() {
      return state.profiles.find(p => p.id === state.activeId) || null;
    },

    addProfile(name) {
      const clean = String(name || '').trim().slice(0, 40);
      if (!clean) return null;
      const existing = state.profiles.find(
        p => p.name.toLowerCase() === clean.toLowerCase()
      );
      if (existing) {
        state.activeId = existing.id;
        write(state);
        return existing;
      }
      const profile = {
        id: 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        name: clean,
        createdAt: new Date().toISOString()
      };
      state.profiles.push(profile);
      state.activeId = profile.id;
      write(state);
      return profile;
    },

    setActive(id) {
      if (state.profiles.some(p => p.id === id)) {
        state.activeId = id;
        write(state);
        return true;
      }
      return false;
    },

    signOut() {
      state.activeId = null;
      write(state);
    },

    removeProfile(id) {
      state.profiles = state.profiles.filter(p => p.id !== id);
      Object.keys(state.data).forEach(key => {
        if (key.indexOf(id + '::') === 0) delete state.data[key];
      });
      if (state.activeId === id) state.activeId = null;
      write(state);
    },

    /* ---- progress ------------------------------------------------------- */
    // One bucket per (profile, pack). Shape:
    //   { words: {word: rec}, activities: {key: {...}}, diagnostic: {...},
    //     sessions: [isoDate, ...] }
    progress(packId) {
      const profile = this.activeProfile();
      if (!profile) return null;
      const key = profile.id + '::' + packId;
      if (!state.data[key]) {
        state.data[key] = { words: {}, activities: {}, diagnostic: null, sessions: [] };
      }
      const bucket = state.data[key];
      bucket.words = bucket.words || {};
      bucket.activities = bucket.activities || {};
      bucket.sessions = bucket.sessions || [];
      return bucket;
    },

    save() {
      return write(state);
    },

    /* ---- housekeeping --------------------------------------------------- */
    // Records that the student opened the pack today (drives the streak).
    touchSession(packId) {
      const bucket = this.progress(packId);
      if (!bucket) return;
      const today = new Date().toISOString().slice(0, 10);
      if (bucket.sessions[bucket.sessions.length - 1] !== today) {
        bucket.sessions.push(today);
        if (bucket.sessions.length > 400) bucket.sessions.shift();
        write(state);
      }
    },

    exportJSON() {
      return JSON.stringify(state, null, 2);
    },

    importJSON(text) {
      const parsed = JSON.parse(text);
      if (!parsed || !Array.isArray(parsed.profiles)) throw new Error('Not a valid backup file.');
      state = parsed;
      write(state);
    },

    resetPack(packId) {
      const profile = this.activeProfile();
      if (!profile) return;
      delete state.data[profile.id + '::' + packId];
      write(state);
    },

    // True when the browser refuses to persist (private mode, blocked storage).
    storageAvailable() {
      try {
        localStorage.setItem(ROOT + '.probe', '1');
        localStorage.removeItem(ROOT + '.probe');
        return true;
      } catch (e) {
        return false;
      }
    }
  };

  window.EA = window.EA || {};
  window.EA.Store = Store;
})();

/* assets/js/srs.js */
/* ===========================================================================
   srs.js — the retrieval engine.

   This is the part the paper workbook can only *describe*. It enforces two
   rules that are stated in the source document:

   1. THE PROMOTION RULE
      "A word becomes green only after the student PRODUCES it correctly on
       two different days. Seeing the answer and saying 'I knew it' does not
       count."
      -> Recognition-type wins (multiple choice, self-marked flashcards) can
         raise a word to AMBER but never to GREEN. Only production-type wins
         (typing the word from memory: gap-fill, dictation, meaning->word)
         count towards green, and they must land on two distinct calendar days.

   2. THE FOUR-WEEK RETRIEVAL PLAN
      Day 1 -> 3 -> 7 -> 14. A correct answer advances the word one step; a
      wrong answer sends it back to the start of the ladder.
   =========================================================================== */

(function () {
  'use strict';

  const INTERVALS = [1, 3, 7, 14];      // days, straight from the workbook
  const GREEN_DAYS_REQUIRED = 2;        // "two different days"

  const RECOGNITION = 'recognition';    // MCQ, self-marked flashcard
  const PRODUCTION = 'production';      // typed from memory

  // Overridable so tests (and a classroom demo of the 14-day plan) can
  // travel in time without waiting two weeks. Set SRS.setClock('2026-03-01').
  let clockOverride = null;

  function today() {
    return clockOverride || new Date().toISOString().slice(0, 10);
  }

  function addDays(isoDate, days) {
    const d = new Date(isoDate + 'T00:00:00');
    d.setDate(d.getDate() + days);
    return d.toISOString().slice(0, 10);
  }

  function blankRecord() {
    return {
      status: 'red',
      box: 0,                 // index into INTERVALS
      due: today(),
      productionDays: [],     // distinct ISO dates with a correct production answer
      seen: 0,
      correct: 0,
      wrong: 0,
      lastSeen: null,
      lastResult: null
    };
  }

  const SRS = {
    INTERVALS,
    RECOGNITION,
    PRODUCTION,

    today,

    /** @param {string|null} isoDate  null restores the real clock. */
    setClock(isoDate) { clockOverride = isoDate; },

    record(bucket, word) {
      if (!bucket.words[word]) bucket.words[word] = blankRecord();
      const rec = bucket.words[word];
      // Migrate any older/partial record shape without losing history.
      if (!Array.isArray(rec.productionDays)) rec.productionDays = [];
      if (typeof rec.box !== 'number') rec.box = 0;
      if (!rec.due) rec.due = today();
      return rec;
    },

    /**
     * Register one answer.
     * @param {object} bucket  progress bucket from Store.progress()
     * @param {string} word    the target word
     * @param {boolean} ok     was the answer correct
     * @param {string} kind    SRS.RECOGNITION or SRS.PRODUCTION
     */
    answer(bucket, word, ok, kind) {
      const rec = this.record(bucket, word);
      const day = today();

      rec.seen += 1;
      rec.lastSeen = day;
      rec.lastResult = ok ? 'correct' : 'wrong';

      if (ok) {
        rec.correct += 1;
        if (kind === PRODUCTION && rec.productionDays.indexOf(day) === -1) {
          rec.productionDays.push(day);
        }
        // Schedule with the CURRENT rung, then step up: the first win is
        // reviewed tomorrow (+1), not in three days.
        rec.due = addDays(day, INTERVALS[rec.box]);
        rec.box = Math.min(rec.box + 1, INTERVALS.length - 1);
      } else {
        rec.wrong += 1;
        // A miss drops the word back to the bottom of the ladder and, if it
        // had been promoted, back down to amber. Green is never free.
        rec.box = 0;
        rec.due = day;
        rec.productionDays = [];
      }

      rec.status = this.statusOf(rec);
      return rec;
    },

    /**
     * Marks a word straight from a flashcard self-assessment.
     * 'red' and 'amber' are honest self-reports and are respected as-is.
     * 'green' is NOT accepted here — the promotion rule requires produced
     * evidence, so a student calling a word green only gets amber.
     */
    selfMark(bucket, word, colour) {
      const rec = this.record(bucket, word);
      const day = today();
      rec.seen += 1;
      rec.lastSeen = day;

      if (colour === 'red') {
        rec.box = 0;
        rec.due = day;
        rec.productionDays = [];
        rec.lastResult = 'wrong';
      } else {
        // "I recognise it" — schedule it, but it stays amber until produced.
        rec.due = addDays(day, INTERVALS[rec.box]);
        rec.box = Math.min(rec.box + 1, INTERVALS.length - 1);
        rec.lastResult = 'correct';
        rec.correct += 1;
      }

      rec.status = this.statusOf(rec);
      return rec;
    },

    // Tolerates a missing or partial record: callers routinely pass
    // bucket.words[word] for a word that has never been studied.
    statusOf(rec) {
      if (!rec || !rec.seen) return 'red';
      const produced = Array.isArray(rec.productionDays) ? rec.productionDays.length : 0;
      if (produced >= GREEN_DAYS_REQUIRED) return 'green';
      // A miss always drops the word back to red, however good its history —
      // otherwise a word that has started failing keeps flattering the tally.
      if (rec.lastResult === 'wrong') return 'red';
      if (rec.correct > 0) return 'amber';
      return 'red';
    },

    /** How far a word is through the promotion rule, for the UI. */
    promotionProgress(rec) {
      const have = rec && Array.isArray(rec.productionDays) ? rec.productionDays.length : 0;
      return { have: Math.min(have, GREEN_DAYS_REQUIRED), need: GREEN_DAYS_REQUIRED };
    },

    isDue(rec) {
      if (!rec || rec.seen === 0) return true;      // never studied = due now
      if (rec.status === 'green') return rec.due <= today();
      return rec.due <= today();
    },

    /**
     * The words the student should see today, worst-first:
     * red before amber before green, and older due dates first.
     */
    dueWords(bucket, words) {
      const rank = { red: 0, amber: 1, green: 2 };
      return words
        .filter(word => this.isDue(bucket.words[word]))
        .sort((a, b) => {
          const ra = bucket.words[a], rb = bucket.words[b];
          const sa = ra ? this.statusOf(ra) : 'red';
          const sb = rb ? this.statusOf(rb) : 'red';
          if (rank[sa] !== rank[sb]) return rank[sa] - rank[sb];
          const da = ra && ra.due ? ra.due : '0000-00-00';
          const db = rb && rb.due ? rb.due : '0000-00-00';
          return da < db ? -1 : da > db ? 1 : 0;
        });
    },

    /** Counts for the dashboard rings. */
    tally(bucket, words) {
      const out = { red: 0, amber: 0, green: 0, due: 0, total: words.length };
      words.forEach(word => {
        const rec = bucket.words[word];
        const status = rec ? this.statusOf(rec) : 'red';
        out[status] += 1;
        if (this.isDue(rec)) out.due += 1;
      });
      return out;
    },

    /** Consecutive-day streak, from the recorded session dates. */
    streak(bucket) {
      const days = (bucket.sessions || []).slice().sort();
      if (!days.length) return 0;
      let streak = 1;
      for (let i = days.length - 1; i > 0; i--) {
        if (addDays(days[i - 1], 1) === days[i]) streak += 1;
        else break;
      }
      // A streak only counts if it reaches today or yesterday.
      const last = days[days.length - 1];
      const t = today();
      if (last !== t && addDays(last, 1) !== t) return 0;
      return streak;
    }
  };

  window.EA = window.EA || {};
  window.EA.SRS = SRS;
})();

/* assets/js/speech.js */
/* ===========================================================================
   speech.js — text-to-speech wrapper.

   This is the dimension the paper workbook cannot have: KET tests Listening
   and penalises spelling, so the student needs to hear a word and write it.
   Uses the browser's built-in speechSynthesis (no network, no API key).

   Voice loading is asynchronous and inconsistent across browsers, so the
   whole thing is written to degrade quietly: if no voice is ever available,
   Speech.supported stays false and the UI hides the audio activities rather
   than offering a button that does nothing.
   =========================================================================== */

(function () {
  'use strict';

  const synth = window.speechSynthesis || null;
  let voices = [];
  let chosen = null;

  function pickVoice() {
    if (!synth) return null;
    voices = synth.getVoices() || [];
    if (!voices.length) return null;
    // Prefer a British voice (KET is a Cambridge exam), then any English one.
    const byLang = pattern => voices.find(v => pattern.test(v.lang || ''));
    chosen =
      voices.find(v => /en[-_]GB/i.test(v.lang || '') && /female|kate|serena|libby|sonia/i.test(v.name || '')) ||
      byLang(/en[-_]GB/i) ||
      byLang(/en[-_]AU/i) ||
      byLang(/en/i) ||
      voices[0];
    return chosen;
  }

  if (synth) {
    pickVoice();
    if (typeof synth.onvoiceschanged !== 'undefined') {
      synth.onvoiceschanged = pickVoice;
    }
  }

  const Speech = {
    get supported() {
      return !!synth && typeof synth.speak === 'function';
    },

    get voiceName() {
      return chosen ? chosen.name : '';
    },

    /**
     * @param {string} text
     * @param {object} [opts]  {rate, pitch, onend}
     */
    say(text, opts) {
      if (!this.supported || !text) return false;
      const options = opts || {};
      try {
        synth.cancel();
        const utterance = new SpeechSynthesisUtterance(String(text));
        if (!chosen) pickVoice();
        if (chosen) {
          utterance.voice = chosen;
          utterance.lang = chosen.lang;
        } else {
          utterance.lang = 'en-GB';
        }
        utterance.rate = options.rate == null ? 0.92 : options.rate;
        utterance.pitch = options.pitch == null ? 1 : options.pitch;
        if (typeof options.onend === 'function') utterance.onend = options.onend;
        synth.speak(utterance);
        return true;
      } catch (e) {
        return false;
      }
    },

    /** Says the word, then the example chunk, so the word is heard in context. */
    sayWithChunk(word, chunk) {
      if (!this.supported) return false;
      const text = chunk ? word + '. ' + chunk : word;
      return this.say(text, { rate: 0.88 });
    },

    stop() {
      if (this.supported) {
        try { synth.cancel(); } catch (e) { /* nothing useful to do */ }
      }
    }
  };

  window.EA = window.EA || {};
  window.EA.Speech = Speech;
})();
